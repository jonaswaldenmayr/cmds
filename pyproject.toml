[project]
name = "cmds"
version = "0.1.0"
description = "Personal notebook of shell commands you use often but cannot remember"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13", "pyyaml>=6"]

[project.scripts]
cmds = "cmds.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
